<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEX Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0e1a;
            color: #fff;
            min-height: 100vh;
            overflow-y: auto;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('vortex-bg.png') center center / cover no-repeat;
            z-index: -2;
            filter: brightness(0.5) blur(4px);
            transform: scale(1.05);
            animation: bgFloat 20s ease-in-out infinite;
        }

        @keyframes bgFloat {
            0%, 100% { transform: scale(1.05) translateY(0); }
            50% { transform: scale(1.1) translateY(-10px); }
        }

        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10, 14, 26, 0.75);
            z-index: -1;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
            background: rgba(26, 35, 58, 0.95);
            border: 1px solid #3b82f6;
            border-radius: 24px;
            box-shadow: 0 0 60px rgba(59, 130, 246, 0.3);
            backdrop-filter: blur(10px);
        }

        .logo {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: 5px;
        }

        .subtitle {
            text-align: center;
            color: #a3b1c6;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .control-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: rgba(16, 23, 42, 0.8);
            border: 1px solid #3b82f6;
            border-radius: 16px;
            padding: 20px;
        }

        .card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            color: #60a5fa;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 10px;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            background: #0a0e1a;
            border: 1px solid #3b82f6;
            border-radius: 8px;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
        }

        .input-field:focus {
            outline: none;
            border-color: #60a5fa;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            border: none;
            border-radius: 10px;
            color: #000;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            transition: all 0.3s;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff5c5c, #d92626);
            color: #fff;
        }

        .btn-gold {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
        }

        .keys-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 700px) {
            .keys-section { grid-template-columns: 1fr; }
        }

        .key-list-box {
            background: rgba(16, 23, 42, 0.8);
            border: 1px solid #3b82f6;
            border-radius: 16px;
            padding: 20px;
            max-height: 600px;
            overflow-y: auto;
        }

        .key-list-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            color: #60a5fa;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .key-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 8px;
            border: 1px solid #2d3f63;
        }

        .key-info {
            flex: 1;
            min-width: 0;
        }

        .key-code {
            font-family: 'JetBrains Mono', monospace;
            color: #60a5fa;
            font-weight: 700;
            word-break: break-all;
        }

        .key-meta {
            font-size: 12px;
            color: #a3b1c6;
            margin-top: 4px;
        }

        .key-actions {
            display: flex;
            gap: 5px;
        }

        .key-btn {
            padding: 6px 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            background: #3b82f6;
            color: #fff;
        }

        .key-btn:hover {
            opacity: 0.8;
        }

        .key-btn.copy {
            background: #4ade80;
        }

        .key-btn.revoke {
            background: #ff5c5c;
        }

        #output {
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            margin-top: 20px;
            border-radius: 12px;
            border-left: 4px solid #3b82f6;
            color: #fff;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
        }

        .section-label {
            font-family: 'Orbitron', sans-serif;
            color: #ffd700;
            margin-bottom: 10px;
            font-size: 14px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">VORTEX</div>
        <div class="subtitle">Admin Panel</div>

        <!-- Controls -->
        <div class="control-section">
            <div class="card">
                <div class="card-title">Create Permanent Key</div>
                <div class="input-group">
                    <input type="text" id="permProfile" class="input-field" placeholder="Profile name (optional)">
                </div>
                <button class="btn" onclick="createPermKey()">⚡ Create PERM</button>
            </div>

            <div class="card">
                <div class="card-title">Create Time-Limited Key</div>
                <div class="input-group">
                    <input type="text" id="timeDuration" class="input-field" placeholder="Duration (e.g., 1d, 1w, 1m)">
                </div>
                <div class="input-group">
                    <input type="text" id="timeProfile" class="input-field" placeholder="Profile name (optional)">
                </div>
                <button class="btn btn-gold" onclick="createTimeKey()">⏳ Create Time Key</button>
            </div>

            <div class="card">
                <div class="card-title">Revoke Key</div>
                <div class="input-group">
                    <input type="text" id="revokeKeyInput" class="input-field" placeholder="Enter key to revoke">
                </div>
                <button class="btn btn-danger" onclick="revokeKey()">❌ Revoke</button>
            </div>
        </div>

        <!-- Key Lists -->
        <div class="keys-section">
            <div class="key-list-box">
                <div class="key-list-title">LootLabs Keys</div>
                <div id="lootlabsKeys"></div>
            </div>
            <div class="key-list-box">
                <div class="key-list-title">Admin Keys</div>
                <div id="adminKeys"></div>
            </div>
        </div>

        <!-- Output -->
        <div id="output">Waiting...</div>
    </div>

    <script>
        const WORKER_URL = 'https://cookie-snap-keys.j26064135.workers.dev';
        let allKeys = [];

        // Load keys on page load (prompt for password)
        const pw = prompt("Enter Admin Password:");
        if (pw) {
            loadKeys(pw);
        } else {
            document.getElementById('output').innerText = "Password required. Reload.";
        }

        async function loadKeys(pw) {
            try {
                const res = await fetch(`${WORKER_URL}/list-keys?pw=${encodeURIComponent(pw)}`);
                const data = await res.json();
                if (data.success) {
                    allKeys = data.keys;
                    renderKeys();
                    document.getElementById('output').innerText = "Loaded " + allKeys.length + " keys.";
                } else {
                    document.getElementById('output').innerHTML = '<span style="color:#ff6b6b;">❌ ' + (data.error || 'Failed to load') + '</span>';
                }
            } catch (e) {
                document.getElementById('output').innerHTML = '<span style="color:#ff6b6b;">❌ Network error: ' + e.message + '</span>';
            }
        }

        function renderKeys() {
            const lootlabs = allKeys.filter(k => k.source === 'lootlabs');
            const admin = allKeys.filter(k => k.source === 'admin' || k.source === 'unknown');

            document.getElementById('lootlabsKeys').innerHTML = lootlabs.length ? lootlabs.map(k => keyItemHTML(k)).join('') : '<div style="color:#64748b; text-align:center;">No LootLabs keys</div>';
            document.getElementById('adminKeys').innerHTML = admin.length ? admin.map(k => keyItemHTML(k)).join('') : '<div style="color:#64748b; text-align:center;">No Admin keys</div>';
        }

        function keyItemHTML(k) {
            const expiryText = k.expiry ? new Date(k.expiry).toLocaleString() : '♾️ Permanent';
            const profile = k.profile ? ` | 👤 ${k.profile}` : '';
            return `
                <div class="key-item">
                    <div class="key-info">
                        <div class="key-code">${k.key}</div>
                        <div class="key-meta">${expiryText}${profile}</div>
                    </div>
                    <div class="key-actions">
                        <button class="key-btn copy" onclick="copyKey('${k.key}')">📋</button>
                        <button class="key-btn revoke" onclick="revokeSpecificKey('${k.key}')">❌</button>
                    </div>
                </div>
            `;
        }

        function copyKey(key) {
            navigator.clipboard.writeText(key).then(() => {
                alert('Copied: ' + key);
            }).catch(() => {
                prompt('Copy this key:', key);
            });
        }

        async function revokeSpecificKey(key) {
            if (!confirm(`Revoke ${key}?`)) return;
            const pw = localStorage.getItem('adminPw') || prompt("Enter Admin Password:");
            await executeCommand(`revoke ${key}`, pw);
            loadKeys(pw);
        }

        async function createPermKey() {
            const profile = document.getElementById('permProfile').value.trim();
            const pw = localStorage.getItem('adminPw') || prompt("Enter Admin Password:");
            await executeCommand('perm', pw, '', profile);
            loadKeys(pw);
        }

        async function createTimeKey() {
            const duration = document.getElementById('timeDuration').value.trim();
            const profile = document.getElementById('timeProfile').value.trim();
            const pw = localStorage.getItem('adminPw') || prompt("Enter Admin Password:");
            await executeCommand('create', pw, duration, profile);
            loadKeys(pw);
        }

        async function revokeKey() {
            const key = document.getElementById('revokeKeyInput').value.trim();
            if (!key) return;
            const pw = localStorage.getItem('adminPw') || prompt("Enter Admin Password:");
            await executeCommand(`revoke ${key}`, pw);
            loadKeys(pw);
        }

        async function executeCommand(command, pw, time, profile) {
            const url = new URL(`${WORKER_URL}/discord-command`);
            url.searchParams.set('command', command);
            url.searchParams.set('pw', pw);
            if (time) url.searchParams.set('time', time);
            if (profile) url.searchParams.set('profile', profile);

            try {
                const res = await fetch(url.toString());
                const data = await res.json();
                if (data.success) {
                    document.getElementById('output').innerHTML = '<span style="color:#4ade80;">✅ ' + data.message + '</span>';
                } else {
                    document.getElementById('output').innerHTML = '<span style="color:#ff6b6b;">❌ ' + (data.error || data.message) + '</span>';
                }
            } catch (e) {
                document.getElementById('output').innerHTML = '<span style="color:#ff6b6b;">❌ Network error: ' + e.message + '</span>';
            }
        }

        // Save password for session
        if (pw) {
            localStorage.setItem('adminPw', pw);
        }
    </script>
</body>
</html>
