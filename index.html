<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEX Admin</title>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #0a0e1a; color: #fff; text-align: center; padding: 20px; }
        .admin-card { max-width: 600px; margin: 0 auto; background: #1a233a; border: 1px solid #3b82f6; border-radius: 20px; padding: 20px; box-shadow: 0 0 40px rgba(59,130,246,0.3); }
        h1 { font-family: 'Orbitron', sans-serif; color: #60a5fa; }
        .btn { padding: 12px 24px; background: linear-gradient(135deg, #60a5fa, #3b82f6); border: none; border-radius: 10px; color: #000; font-weight: bold; cursor: pointer; margin: 8px; }
        .btn:hover { transform: scale(1.05); }
        .input-field { padding: 10px; background: #0a0e1a; border: 1px solid #3b82f6; border-radius: 8px; color: #fff; margin: 5px; width: 90%; }
        #output { background: rgba(0,0,0,0.5); padding: 15px; margin-top: 15px; border-radius: 8px; border-left: 4px solid #3b82f6; text-align: left; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
        .error { color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="admin-card">
        <h1>VORTEX ADMIN</h1>
        <p>Enter admin password to continue.</p>
        <input type="password" id="pwInput" class="input-field" placeholder="Admin Password">
        <br>
        <button class="btn" onclick="createPermanentKey()">Create Permanent Key</button>
        <button class="btn" onclick="createTimeKey()">Create Time Key</button>
        <button class="btn" onclick="listKeys()">List Keys</button>
        <button class="btn" onclick="revokeKey()">Revoke Key</button>
        <div id="output">Waiting...</div>
    </div>

    <script>
        const WORKER_URL = 'https://cookie-snap-keys.j26064135.workers.dev';

        function getPw() {
            return document.getElementById('pwInput').value;
        }

        async function callWorker(command, time, profile) {
            const pw = getPw();
            const url = new URL(`${WORKER_URL}/discord-command`);
            url.searchParams.set('command', command);
            url.searchParams.set('pw', pw);
            if (time) url.searchParams.set('time', time);
            if (profile) url.searchParams.set('profile', profile);

            const output = document.getElementById('output');
            output.textContent = "Sending...";

            try {
                const res = await fetch(url.toString());
                const data = await res.json();
                if (data.success) {
                    output.innerHTML = '<span style="color:#4ade80;">✅ ' + data.message + '</span>';
                } else {
                    output.innerHTML = '<span class="error">❌ ' + (data.error || data.message) + '</span>';
                }
            } catch (e) {
                output.innerHTML = '<span class="error">❌ Network error: ' + e.message + '</span>';
            }
        }

        function createPermanentKey() {
            const profile = prompt("Enter profile name (optional):");
            callWorker('perm', '', profile);
        }

        function createTimeKey() {
            const days = prompt("Enter duration (e.g., 1d, 1w, 1m, 1y):");
            const profile = prompt("Enter profile name (optional):");
            callWorker('create', days, profile);
        }

        function listKeys() {
            callWorker('list');
        }

        function revokeKey() {
            const key = prompt("Enter key to revoke:");
            callWorker('revoke ' + key);
        }
    </script>
</body>
</html>
