<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookie Snap Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a1a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #fff;
    }
    .golden-card {
      width: 100%;
      max-width: 800px;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
      background-size: 200% 200%;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      animation: goldShimmer 6s ease infinite;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      padding: 20px;
    }
    .golden-card::after {
      content: "";
      position: absolute;
      top: 0;
      left: -75%;
      width: 50%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,0.5), transparent);
      transform: skewX(-20deg);
      transition: left 0.6s ease;
    }
    .golden-card:hover {
      transform: scale(1.02) translateY(-5px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.4), 0 0 25px rgba(255,215,0,0.7);
    }
    .golden-card:hover::after {
      left: 125%;
    }
    @keyframes goldShimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .inner-card {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.4);
    }
    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 15px;
      color: #fcf6ba;
      text-shadow: 0 0 5px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728);
      color: #1a1a1a;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255,215,0,0.5);
    }
    .btn-danger { background: linear-gradient(135deg, #e74c3c, #ff6b6b); color: white; }
    .btn-success { background: linear-gradient(135deg, #2ecc71, #27ae60); color: white; }
    .btn-sm {
      width: auto;
      padding: 6px 12px;
      font-size: 0.8rem;
      margin: 4px;
    }
    .btn.loading { opacity: 0.6; pointer-events: none; }
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; margin-bottom: 6px; color: #fcf6ba; font-size: 0.9rem; }
    .input-group select, .input-group input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 2px solid #b38728;
      background: #1a1a1a;
      color: white;
      font-size: 1rem;
    }
    .input-group select:focus, .input-group input:focus { outline: none; border-color: #fcf6ba; }
    .key-list { margin-top: 10px; }
    .key-item {
      background: rgba(0,0,0,0.7);
      border: 1px solid #b38728;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .key-name { font-family: monospace; color: #fcf6ba; font-size: 1.1rem; font-weight: bold; }
    .key-status { font-size: 0.85rem; margin-top: 4px; }
    .key-status.claimed { color: #2ecc71; }
    .key-status.unclaimed { color: #f39c12; }
    .key-countdown { font-size: 0.9rem; color: #ffd700; font-weight: 600; }
    .key-actions { display: flex; gap: 5px; margin-top: 5px; }
    #output {
      margin-top: 20px;
      padding: 15px;
      background: rgba(0,0,0,0.7);
      border-radius: 10px;
      border-left: 4px solid #ffd700;
      color: #fcf6ba;
      min-height: 60px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .error { color: #ff6b6b; }
    .success { color: #2ecc71; }
    .footer { text-align: center; margin-top: 20px; font-size: 0.8rem; color: #fcf6ba; }
    @media (max-width: 600px) { .golden-card { width: 100%; } }
  </style>
</head>
<body>
  <div class="golden-card">
    <h1 style="text-align:center; color:#2d2d2d; text-shadow:0 0 10px rgba(255,255,255,0.5);">🍪 Cookie Snap Admin</h1>
    <p style="text-align:center; color:#2d2d2d; margin-bottom:20px;">Gold Edition</p>

    <div class="inner-card">
      <div class="card-title">🔑 Create Key</div>
      <div class="input-group">
        <label for="duration">Duration:</label>
        <select id="duration">
          <option value="1d">1 Day</option>
          <option value="1w">1 Week</option>
          <option value="1m">1 Month</option>
          <option value="1y">1 Year</option>
          <option value="perm">Permanent</option>
        </select>
      </div>
      <button class="btn btn-success" id="createBtn">➕ Create Key</button>
    </div>

    <div class="inner-card">
      <div class="card-title">📋 List Keys (with countdown)</div>
      <div style="margin-bottom:10px;">
        <button class="btn btn-sm" id="copyAllBtn">📋 Copy All Keys</button>
        <button class="btn btn-sm" id="refreshBtn">🔄 Refresh Keys</button>
      </div>
      <div id="keyList" class="key-list"></div>
    </div>

    <div class="inner-card">
      <div class="card-title">⚙️ Custom Command</div>
      <div class="input-group">
        <label for="customCmd">Any command (e.g., create 1d)</label>
        <input type="text" id="customCmd" placeholder="e.g., create 1d">
      </div>
      <button class="btn" id="runCustomBtn">▶️ Run</button>
    </div>

    <div id="output">Waiting…</div>
    <div class="footer">Cookie Snap • v5.0 • Admin</div>
  </div>

  <script>
    const WORKER_URL = "https://cookie-snap-keys.j26064135.workers.dev";
    let ADMIN_PASSWORD = "";
    let keyData = [];

    (function init() {
      ADMIN_PASSWORD = prompt("Enter Admin Password:");
      if (!ADMIN_PASSWORD) {
        alert("Password required. Reloading…");
        location.reload();
        return;
      }
      attachEvents();
      fetchKeys();
      setInterval(fetchKeys, 5000);
    })();

    function attachEvents() {
      document.getElementById('createBtn').addEventListener('click', createKey);
      document.getElementById('copyAllBtn').addEventListener('click', copyAllKeys);
      document.getElementById('refreshBtn').addEventListener('click', handleRefresh);
      document.getElementById('runCustomBtn').addEventListener('click', runCustom);
    }

    async function handleRefresh() {
      const btn = document.getElementById('refreshBtn');
      btn.classList.add('loading');
      btn.textContent = '⏳ Refreshing…';
      try {
        await fetchKeys();
      } finally {
        btn.classList.remove('loading');
        btn.textContent = '🔄 Refresh Keys';
      }
    }

    async function run(cmd, timeParam = "") {
      if (!ADMIN_PASSWORD) return;
      const url = new URL(`${WORKER_URL}/discord-command`);
      url.searchParams.set("command", cmd);
      url.searchParams.set("pw", ADMIN_PASSWORD);
      if (timeParam) url.searchParams.set("time", timeParam);

      const output = document.getElementById('output');
      output.textContent = "⏳ Sending…";
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.success) {
          output.innerHTML = `<span class="success">✅ ${data.message}</span>`;
        } else {
          output.innerHTML = `<span class="error">❌ ${data.error}</span>`;
          if (data.error === "Wrong password") {
            ADMIN_PASSWORD = prompt("Enter Admin Password:");
            if (ADMIN_PASSWORD) fetchKeys();
          }
        }
      } catch (e) {
        output.innerHTML = `<span class="error">❌ Network error: ${e.message}</span>`;
      }
    }

    function createKey() {
      const duration = document.getElementById('duration').value;
      if (duration === "perm") run("perm");
      else run("create", duration);
    }

    function maskKey(key) {
      const dashIndex = key.indexOf('-');
      if (dashIndex === -1) {
        if (key.length <= 6) return key;
        return key.substring(0, 3) + '...' + key.substring(key.length - 3);
      }
      const prefixLen = dashIndex + 2;
      const suffixLen = 1;
      if (key.length <= prefixLen + suffixLen) return key;
      const prefix = key.substring(0, prefixLen);
      const suffix = key.substring(key.length - suffixLen);
      const hidden = '*'.repeat(key.length - prefixLen - suffixLen);
      return prefix + hidden + suffix;
    }

    function copyKey(key) {
      navigator.clipboard.writeText(key).then(() => {
        alert(`Key ${maskKey(key)} copied!`);
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = key;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        alert(`Key ${maskKey(key)} copied!`);
      });
    }

    function revokeKey(key) {
      if (!key) return;
      if (!confirm(`Revoke key ${maskKey(key)}?\nThis cannot be undone.`)) return;
      run("revoke " + key).then(() => {
        setTimeout(fetchKeys, 500);
      });
    }

    function copyAllKeys() {
      if (!keyData.length) return alert("No keys to copy");
      const text = keyData.map(k => k.key).join('\n');
      navigator.clipboard.writeText(text).then(() => {
        alert("All keys copied!");
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        alert("All keys copied!");
      });
    }

    function runCustom() {
      const cmd = document.getElementById('customCmd').value.trim();
      if (!cmd) return alert("Please enter a command");
      const parts = cmd.split(/\s+/);
      if (parts[0].toLowerCase() === "create") {
        const timeParam = parts[1] || "1d";
        run("create", timeParam);
      } else {
        run(cmd);
      }
    }

    async function fetchKeys() {
      if (!ADMIN_PASSWORD) {
        ADMIN_PASSWORD = prompt("Enter Admin Password:");
        if (!ADMIN_PASSWORD) return;
      }
      const url = `${WORKER_URL}/list-keys?pw=${encodeURIComponent(ADMIN_PASSWORD)}`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.success) {
          keyData = data.keys;
          renderKeys();
        } else {
          console.error("Failed to fetch keys: " + data.error);
          if (data.error === "Wrong password") {
            ADMIN_PASSWORD = prompt("Enter Admin Password:");
            if (ADMIN_PASSWORD) fetchKeys();
          }
        }
      } catch (e) {
        console.error("Network error: " + e.message);
      }
    }

    function renderKeys() {
      const keyList = document.getElementById('keyList');
      keyList.innerHTML = "";
      if (!keyData.length) {
        keyList.innerHTML = "<div style='color:#fcf6ba;'>No keys found.</div>";
        return;
      }
      keyData.forEach(item => {
        const div = document.createElement('div');
        div.className = 'key-item';

        const left = document.createElement('div');
        const name = document.createElement('span');
        name.className = 'key-name';
        name.textContent = maskKey(item.key);
        left.appendChild(name);

        const status = document.createElement('div');
        status.className = 'key-status ' + (item.pending ? 'unclaimed' : 'claimed');
        status.textContent = item.pending ? '⏳ Unclaimed' : '✅ Claimed';
        left.appendChild(status);

        div.appendChild(left);

        const right = document.createElement('div');
        right.style.display = "flex";
        right.style.flexDirection = "column";
        right.style.alignItems = "flex-end";

        const countdown = document.createElement('span');
        countdown.className = 'key-countdown';
        countdown.dataset.expiry = item.expiry;
        countdown.dataset.pending = item.pending ? 'true' : 'false';
        right.appendChild(countdown);

        const actions = document.createElement('div');
        actions.className = 'key-actions';

        const copyBtn = document.createElement('button');
        copyBtn.className = 'btn btn-sm';
        copyBtn.textContent = '📋 Copy';
        copyBtn.addEventListener('click', () => copyKey(item.key));
        actions.appendChild(copyBtn);

        const revokeBtn = document.createElement('button');
        revokeBtn.className = 'btn btn-sm btn-danger';
        revokeBtn.textContent = '❌ Revoke';
        revokeBtn.addEventListener('click', () => revokeKey(item.key));
        actions.appendChild(revokeBtn);

        right.appendChild(actions);
        div.appendChild(right);

        keyList.appendChild(div);
      });
      updateCountdowns();
    }

    function updateCountdowns() {
      document.querySelectorAll('.key-countdown').forEach(el => {
        const expiry = el.dataset.expiry;
        const pending = el.dataset.pending === 'true';
        if (!expiry) {
          el.textContent = "♾️ Permanent";
          return;
        }
        const diff = new Date(expiry) - Date.now();
        if (diff <= 0) {
          el.textContent = pending ? "⏳ Deleting..." : "⛔ Expired";
          return;
        }
        const days = Math.floor(diff / (1000*60*60*24));
        const hours = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
        const mins = Math.floor((diff % (1000*60*60)) / (1000*60));
        const secs = Math.floor((diff % (1000*60)) / 1000);
        if (pending) {
          el.textContent = `Deleting in ${mins}m ${secs}s`;
        } else {
          el.textContent = `${days}d-${hours}h-${mins}m-${secs}s`;
        }
      });
    }

    setInterval(updateCountdowns, 1000);
  </script>
</body>
</html>
